name: 7-Day Embedded Ecosystem Audit & Smart Streak Keeper

on:
  schedule:
    # Morning Check: 03:17 UTC = 08:47 AM IST
    - cron: '17 3 * * *'
    # Evening Backup: 11:43 UTC = 05:13 PM IST
    - cron: '43 11 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Cycle day override (1..7, or auto)'
        required: false
        default: 'auto'
      commits:
        description: 'Number of commits override (1..5, or random)'
        required: false
        default: 'random'

permissions:
  contents: write

jobs:
  ecosystem-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Author
        run: |
          git config --global user.name "Sherifred singh"
          git config --global user.email "ssherifred@gmail.com"

      - name: Run Rotating Ecosystem Audit (Randomized 1-5 Commits)
        run: |
          ARGS="--commit-and-push"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --skip-if-active"
          fi
          if [ "${{ inputs.day }}" != "auto" ] && [ -n "${{ inputs.day }}" ]; then
            ARGS="$ARGS --day ${{ inputs.day }}"
          fi
          if [ "${{ inputs.commits }}" != "random" ] && [ -n "${{ inputs.commits }}" ]; then
            ARGS="$ARGS --commits ${{ inputs.commits }}"
          fi
          python scripts/update_telemetry.py $ARGS
